<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>中学受験 社会 一問一答クイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="app-header">
    <h1>中学受験 社会クイズ</h1>
    <p class="subtitle">科目と単元を選んで、学んだ内容をアウトプットしよう</p>
  </header>

  <main id="screen-home" class="screen">
    <section class="about-box">
      <p>
        動画で歴史を学んでも、「覚えたつもり」で終わってしまいがち。
        このクイズは、インプットした内容をその場でアウトプットして、
        本当に定着しているかを確認するために作りました。無料・登録不要でどなたでも使えます。
      </p>
      <p class="about-link">
        作った経緯は<a href="https://ka8kfc.hatenablog.com/" target="_blank" rel="noopener">中学受験リアル日記のブログ</a>で書いています。
      </p>
      <p class="about-link">
        調べた頻出用語のリサーチは<a href="research.html">こちら</a>。
      </p>
    </section>
    <div id="subject-tabs" class="subject-tabs"></div>
    <div id="era-list" class="era-grid"></div>
  </main>

  <main id="screen-quiz" class="screen hidden">
    <div class="quiz-topbar">
      <button id="btn-back" class="btn-text">← 単元を選び直す</button>
      <div id="progress" class="progress"></div>
    </div>
    <h2 id="quiz-title" class="quiz-title"></h2>
    <div id="question-box" class="question-box">
      <p id="question-text" class="question-text"></p>
      <div id="choices" class="choices"></div>
      <p id="feedback" class="feedback hidden"></p>
      <button id="btn-next" class="btn-primary hidden">次の問題へ</button>
    </div>
  </main>

  <main id="screen-result" class="screen hidden">
    <h2>結果発表</h2>
    <p id="result-summary" class="result-summary"></p>
    <div id="result-wrong" class="result-wrong"></div>
    <div class="result-actions">
      <button id="btn-retry" class="btn-primary">同じ時代をもう一度</button>
      <button id="btn-home" class="btn-secondary">時代選択にもどる</button>
    </div>
  </main>

</div>
<script src="history-questions.js"></script>
<script src="geography-questions.js"></script>
<script src="civics-questions.js"></script>
<script src="subjects.js"></script>
<script src="app.js"></script>
</body>
</html>
