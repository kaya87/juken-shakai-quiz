<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>中学受験 社会 一問一答クイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="app-header">
    <h1>中学受験 社会クイズ</h1>
    <p class="subtitle">科目と単元を選んで、学んだ内容をアウトプットしよう</p>
  </header>

  <main id="screen-home" class="screen">
    <section class="about-box">
      <p>
        動画で歴史を学んでも、「覚えたつもり」で終わってしまいがち。
        このクイズは、インプットした内容をその場でアウトプットして、
        本当に定着しているかを確認するために作りました。無料・登録不要でどなたでも使えます。
      </p>
      <p class="about-link">
        作った経緯は<a href="https://ka8kfc.hatenablog.com/" target="_blank" rel="noopener">中学受験リアル日記のブログ</a>で書いています。
      </p>
      <p class="about-link">
        調べた頻出用語のリサーチは<a href="research.html">こちら</a>。
      </p>
      <p class="about-link">
        <a href="index.html">← ホームに戻る</a>
      </p>
    </section>
    <div id="subject-tabs" class="subject-tabs"></div>
    <button id="btn-open-random" class="random-entry">🎲 ランダム出題で練習する</button>
    <div id="era-list" class="era-grid"></div>
  </main>

  <main id="screen-random-setup" class="screen hidden">
    <div class="quiz-topbar">
      <button id="btn-random-back" class="btn-text">← 単元を選び直す</button>
    </div>
    <h2 class="quiz-title">🎲 ランダム出題の範囲を選ぶ</h2>
    <div class="random-setup-box">
      <div class="random-setup-row">
        <button id="btn-select-all" class="btn-text">全て選択</button>
        <button id="btn-select-none" class="btn-text">全て解除</button>
      </div>
      <div id="unit-checklist" class="unit-checklist"></div>
      <p class="random-setup-label">出題数</p>
      <div id="count-buttons" class="count-buttons"></div>
      <button id="btn-start-random" class="btn-primary">この条件で始める</button>
    </div>
  </main>

  <main id="screen-quiz" class="screen hidden">
    <div class="quiz-topbar">
      <button id="btn-back" class="btn-text">← 単元を選び直す</button>
      <div id="progress" class="progress"></div>
    </div>
    <h2 id="quiz-title" class="quiz-title"></h2>
    <div id="question-box" class="question-box">
      <p id="question-text" class="question-text"></p>
      <div id="choices" class="choices"></div>
      <p id="feedback" class="feedback hidden"></p>
      <button id="btn-next" class="btn-primary hidden">次の問題へ</button>
    </div>
  </main>

  <main id="screen-result" class="screen hidden">
    <h2>結果発表</h2>
    <p id="result-summary" class="result-summary"></p>
    <div id="result-wrong" class="result-wrong"></div>
    <div class="result-actions">
      <button id="btn-retry" class="btn-primary">もう一度</button>
      <button id="btn-home" class="btn-secondary">単元選択にもどる</button>
    </div>
  </main>

</div>
<script src="history-questions.js"></script>
<script src="geography-questions.js"></script>
<script src="civics-questions.js"></script>
<script src="subjects.js"></script>
<script src="app.js"></script>
</body>
</html>
